<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EasyWorld Admin Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Font Awesome (optional) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg: #0d0d0d;
      --card: #141414;
      --gold: #d4af37;
      --text: #f5f5f5;
      --muted: #9a9a9a;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .login-card {
      background: var(--card);
      padding: 2.5rem;
      width: 100%;
      max-width: 380px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,.6);
    }

    .login-card h2 {
      margin-bottom: 1.5rem;
      text-align: center;
      color: var(--gold);
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    .form-group label {
      display: block;
      font-size: .9rem;
      margin-bottom: .4rem;
      color: var(--muted);
    }

    .form-group input {
      width: 100%;
      padding: .65rem;
      border-radius: 6px;
      border: 1px solid #333;
      background: #0f0f0f;
      color: var(--text);
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--gold);
    }

    .login-btn {
      width: 100%;
      margin-top: 1rem;
      padding: .7rem;
      border: none;
      border-radius: 6px;
      background: var(--gold);
      color: #000;
      font-weight: 600;
      cursor: pointer;
    }

    .login-btn:hover {
      opacity: .9;
    }

    .flash {
      background: #2a1f00;
      color: var(--gold);
      padding: .6rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      text-align: center;
      font-size: .9rem;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>EasyWorld Admin</h2>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash">{{ messages[0] }}</div>
      {% endif %}
    {% endwith %}

    <form method="POST">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>

      <button class="login-btn" type="submit">
        <i class="fas fa-lock"></i> Login
      </button>
    </form>
  </div>

</body>
</html>
